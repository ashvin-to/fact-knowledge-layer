[project]
name = "fact-extraction-service"
version = "0.1.0"
description = "Fact extraction service: ingest PDFs, extract discrete facts via LLM, persist to SQLite."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch>=2.0.0",
    "fastapi>=0.115.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "instructor>=1.16.0",
    "numpy>=2.0.0",
    "openai>=1.60.0",
    "pdf-inspector>=1.17.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "usearch>=2.26.2",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
serve = "src.main:start"
